# This file contains common pin mappings for the 2017 Monoprice
# Mini Delta. To use this config, the firmware should be compiled for the
# STM32F070 microcontroller with an 8MHz crystal and USB for communication.
#
# IMPORTANT: Use of Kipper with a Monoprice Mini Delta requires a power supply
# with a _minimum_ 120 W (i.e. 10 A) capacity! The stock power supply will not
# work, as it can't power the hotend and the bed at the same time.
#
# Note 1: Some controller boards only trigger the bootloader when an update file
# is "printed" from the LCD, rather than supporting bootloader triggering
# during bootup. It may be preferable to use an ST-Link V2 to flash the
# firmware instead. Follow this link for an example of the commands needed to
# do this: https://github.com/arkorobotics/MiniDeltaBootloader
#
# Note 2: Klipper does not currently support the LCD interface used on this
# printer.
#
# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
#[include macros.cfg]

[gcode_arcs]
# resolution: 1.0 # Optional: lower value for finer arcs

# Stepper A is the front-left tower, as originally wired. If you've rewired
# your steppers to "correct" this, you'll need to swap these values.
[stepper_a]
homing_speed: 50
step_pin: gpio6
dir_pin: gpio3
enable_pin: !gpio7
microsteps: 32
rotation_distance: 56
endstop_pin: tmc2209_stepper_a:virtual_endstop
#endstop_pin: gpio13
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[tmc2209 stepper_a]
uart_pin:gpio9
uart_address:0
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0                        # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle
diag_pin: ^gpio13
driver_SGTHRS: 80

[stepper_b]
step_pin: gpio1
dir_pin: gpio0
enable_pin: !gpio2
microsteps: 32
rotation_distance: 56
endstop_pin: tmc2209_stepper_b:virtual_endstop
#endstop_pin: gpio14
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[tmc2209 stepper_b]
uart_pin:gpio9
uart_address:1
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^gpio14
driver_SGTHRS: 80

[stepper_c]
step_pin: gpio26
dir_pin: gpio25
enable_pin: !gpio27
microsteps: 32
rotation_distance: 56
endstop_pin: tmc2209_stepper_c:virtual_endstop
#endstop_pin: gpio15
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[tmc2209 stepper_c]
uart_pin:gpio9
uart_address:2
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^gpio15
driver_SGTHRS: 80

[extruder]
step_pin: gpio23
dir_pin: !gpio22
enable_pin: !gpio24
microsteps: 32
rotation_distance: 15.42 # BMG extruder with 0.9 degree motor
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio28
# calibrated at 240C on stock hardware
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 50.01

[tmc2209 extruder]
uart_pin:gpio9
uart_address:3
interpolate: False
run_current: 0.8
sense_resistor: 0.110

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio29
# calibrated at 70C on stock hardware
#control: pid
#pid_kp: 51.249
#pid_ki: 4.437
#pid_kd: 147.983
min_temp: 0
max_temp: 130

[heater_fan hotend_fan]
pin: gpio16
max_power: 1.0
heater: extruder
heater_temp: 50

#####################################################################
#      Master ID Configuration
#####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C7403107937-if00

#####################################################################
#      Temperature monitoring
#####################################################################
[temperature_sensor Micro4]        #显示主板的温度
sensor_type: temperature_mcu


[printer]
kinematics: delta
max_velocity: 150
max_accel: 1200
max_z_velocity: 100
# minimum_z_position is negative to allow delta calibration to work
minimum_z_position: -10.0
#delta_radius: 63.00
# Some users report better success using the following value for arm_length:
#delta_radius: 62.70

[delta_calibrate]
radius: 50
speed: 50
horizontal_move_z: 5

######################################################################
# Bed leveling support
######################################################################

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_radius: 50
round_probe_count: 5
fade_start: 1.0
fade_end: 0.0

######################################################################
# Bed probing hardware
######################################################################

[probe]
pin: ^!gpio19
x_offset: 0.0
y_offset: 0.0
#z_offset: 0.0
speed: 5.0
samples: 3
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.100
samples_tolerance_retries: 2

######################################################################
# Other hardware
######################################################################


