# This file contains common pin mappings for the 2017 Monoprice
# Mini Delta. To use this config, the firmware should be compiled for the
# STM32F070 microcontroller with an 8MHz crystal and USB for communication.
#
# IMPORTANT: Use of Kipper with a Monoprice Mini Delta requires a power supply
# with a _minimum_ 120 W (i.e. 10 A) capacity! The stock power supply will not
# work, as it can't power the hotend and the bed at the same time.
#
# Note 1: Some controller boards only trigger the bootloader when an update file
# is "printed" from the LCD, rather than supporting bootloader triggering
# during bootup. It may be preferable to use an ST-Link V2 to flash the
# firmware instead. Follow this link for an example of the commands needed to
# do this: https://github.com/arkorobotics/MiniDeltaBootloader
#
# Note 2: Klipper does not currently support the LCD interface used on this
# printer.
#
# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[gcode_arcs]
# resolution: 1.0 # Optional: lower value for finer arcs

[led status_led]
red_pin: !PB15
green_pin: !PB8
blue_pin: !PB9
#   The pin controlling the given LED color. At least one of the above
#   parameters must be provided.
cycle_time: 0.010
#   The amount of time (in seconds) per PWM cycle. It is recommended
#   this be 10 milliseconds or greater when using software based PWM.
#   The default is 0.010 seconds.
hardware_pwm: False
#   Enable this to use hardware PWM instead of software PWM. When
#   using hardware PWM the actual cycle time is constrained by the
#   implementation and may be significantly different than the
#   requested cycle_time. The default is False.
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
#initial_WHITE: 0.0
#   Sets the initial LED color. Each value should be between 0.0 and
#   1.0. The default for each color is 0.

# Stepper A is the front-left tower, as originally wired. If you've rewired
# your steppers to "correct" this, you'll need to swap these values.
[stepper_a]
homing_speed: 50
step_pin: PB12
dir_pin: PB11
enable_pin: !PB10
microsteps: 32
rotation_distance: 56
endstop_pin: ^PC14
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[stepper_b]
step_pin: PB2
dir_pin: PB1
enable_pin: !PB10
microsteps: 32
rotation_distance: 56
endstop_pin: ^PC15
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[stepper_c]
step_pin: PB14
dir_pin: PB13
enable_pin: !PB10
microsteps: 32
rotation_distance: 56
endstop_pin: ^PC13
#position_endstop: 125.00
#arm_length: 120.8
# Some users report better success using the following value for arm_length:
#arm_length: 121.36

[extruder]
step_pin: PA7
dir_pin: !PA6
enable_pin: !PB0
microsteps: 32
rotation_distance: 65.984 # default
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
# calibrated at 240C on stock hardware
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 50.01

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4
# calibrated at 70C on stock hardware
#control: pid
#pid_kp: 51.249
#pid_ki: 4.437
#pid_kd: 147.983
min_temp: 0
max_temp: 130

[heater_fan hotend_fan]
pin: PA8
heater: extruder
heater_temp: 50

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[printer]
kinematics: delta
max_velocity: 150
max_accel: 1200
max_z_velocity: 100
# minimum_z_position is negative to allow delta calibration to work
minimum_z_position: -10.0
#delta_radius: 63.00
# Some users report better success using the following value for arm_length:
#delta_radius: 62.70

[delta_calibrate]
radius: 50
speed: 50
horizontal_move_z: 5

######################################################################
# Bed leveling support
######################################################################

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_radius: 50
round_probe_count: 5
fade_start: 1.0
fade_end: 0.0

######################################################################
# Bed probing hardware
######################################################################

[probe]
pin: ^!PB7
x_offset: 0.0
y_offset: 0.0
#z_offset: 0.0
speed: 5.0
samples: 3
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.100
samples_tolerance_retries: 2

######################################################################
# Buttons
######################################################################

[gcode_macro BUTTON_STATE]
variable_pressed: 0
variable_duration: 0.0
variable_step_sec: 0.2       # loop period in seconds
variable_threshold_sec: 2.0  # long-press threshold
gcode:
    ; state holder macro

# combination emergency stop button
# short press for emergency stop
# long press > 2 seconds to restart firmware
# long press will not work in emergency stop state
[gcode_button estop_combo]
pin: ^PA15
debounce_delay: 0.05 # debounce time in seconds

press_gcode:
#   A list of G-Code commands to execute when the button is pressed.
#   G-Code templates are supported. This parameter must be provided.
  # Record press time and mark pressed
  SET_GCODE_VARIABLE MACRO=BUTTON_STATE VARIABLE=pressed VALUE=1
  SET_GCODE_VARIABLE MACRO=BUTTON_STATE VARIABLE=duration VALUE=0
  # Start feedback loop
  UPDATE_DELAYED_GCODE ID=button_feedback DURATION={printer["gcode_macro BUTTON_STATE"].step_sec}
  
release_gcode:
#   A list of G-Code commands to execute when the button is released.
#   G-Code templates are supported. The default is to not run any
#   commands on a button release.
  SET_GCODE_VARIABLE MACRO=BUTTON_STATE VARIABLE=pressed VALUE=0
  {% set duration = printer["gcode_macro BUTTON_STATE"].duration|float %}
  RESPOND TYPE=command MSG="Button held for {duration} s"
  {% if duration < printer["gcode_macro BUTTON_STATE"].threshold_sec %}
    # Short press → Emergency stop
    SET_LED LED=status_led RED=1
    RESPOND TYPE=command MSG="EMERGENCY STOP!"
    M112
  {% else %}
    # Long press → Firmware restart
    SET_LED LED=status_led RED=1 BLUE=1
    RESPOND TYPE=command MSG="Firmware restarting..."
    G4 P500
    FIRMWARE_RESTART
  {% endif %}

[delayed_gcode button_feedback]
initial_duration: 0.0
gcode:
  {% if printer["gcode_macro BUTTON_STATE"].pressed == 1 %}
    # increment duration by step size
    {% set step = printer["gcode_macro BUTTON_STATE"].step_sec|float %}
    {% set dur = (printer["gcode_macro BUTTON_STATE"].duration|float) + step %}
    SET_GCODE_VARIABLE MACRO=BUTTON_STATE VARIABLE=duration VALUE={dur}
    {% set th = printer["gcode_macro BUTTON_STATE"].threshold_sec|float %}

    {% if dur < th %}
      # Short press mode → blink red only
      SET_LED LED=status_led RED=1
      G4 P200
      SET_LED LED=status_led RED=0
    {% else %}
      # Long press mode → alternate red/blue
      SET_LED LED=status_led RED=1
      G4 P200
      SET_LED LED=status_led BLUE=1
    {% endif %}
    # Re‑schedule loop
    UPDATE_DELAYED_GCODE ID=button_feedback DURATION={step}
  {% endif %}

######################################################################
# G-Code macros and events
######################################################################

# G-Code macros (one may define any number of sections with a
# "gcode_macro" prefix).

[gcode_macro DRAW_PRIME_ARC]
gcode:
    G92 E0 ; reset extrusion distance
    G1 X-54 Y0 Z0.4 F3000 ; Move to arc start (near edge)                                                                                       
    G3 X0 Y-54 I54 Z0.4 E15 F400 ; Draw a 90-degree arc (adjust E for extrusion amount)                                                         
    G92 E0 ; Reset extrusion again                                                                                                              
    G1 X0 Y-54 Z4 E-1 F3000 ; Retract slightly & lift off bed                                                                                   

[gcode_macro START_PRINT]
gcode:
    SET_LED LED=status_led RED=1 BLUE=0 GREEN=0
    {% set BED_TARGET = params.BED|default(60)|float %}
    {% set EXTRUDER_TARGET = params.EXTRUDER|default(180)|float %}
    G90 ; switch to absolute positioning - this line was added in case Cura doesn't include it by default
    M82 ; set extruder to absolute mode - this line was added in case Cura doesn't include it by default
    G28 ; start from home position
    {% if BED_TARGET > 60 %}
      {% set BED_TEMP = printer.heater_bed.temperature %}
      {% if BED_TEMP < 50 %}
        ; preheat bed to 50 degrees before heating the nozzle
        M190 S50
      {% endif %}
    {% endif %}
    ; heat bed and nozzle at the same time by not waiting
    M140 S{BED_TARGET}
    M104 S{EXTRUDER_TARGET}
    ; wait until both target bed and nozzle temperatures are reached
    M190 S{BED_TARGET}
    M109 S{EXTRUDER_TARGET}
    ; now do mesh calibration
    G1 E-1 F700 ; retract the filament a bit
    G92 E0 ; reset extrusion distance
    BED_MESH_CALIBRATE
    G1 X0 Y0 Z15.0 F4800  ; move the nozzle up 15mm
    DRAW_PRIME_ARC
    G92 E0 ; reset extrusion distance again
    G1 F4800
    SET_LED LED=status_led RED=0 BLUE=0 GREEN=1

[gcode_macro END_PRINT]
gcode:
    M104 S0 ; turn off hotend heater
    M140 S0 ; turn off bed heater
    G91 ; Switch to use Relative Coordinates
    G1 E-3 F700 ; retract the filament a bit before lifting the nozzle to release some of the pressure
    G1 Z2 F1000 ; raise platform 2mm from current position
    G1 E-2 F700 ; retract filament even more
    G90 ; Switch back to using absolute coordinates
    G28 X Y Z ; Return to home position. Without an X Y or Z after G28 the print completion time will not be displayed on the Mini Deltas display.
    M84 ; disable motors
    M107 ; turn off fan. Do not use M106 S1. Using M106 S1 may prevent the fan from turning on for the following print. Some say M107 does not work for them but if the hotend is below 70 degrees it should work
    SET_LED LED=status_led RED=1 BLUE=1 GREEN=1

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    SET_LED LED=status_led RED=1 GREEN=0 BLUE=1
    M117 Print cancelled!
    CANCEL_PRINT_BASE

